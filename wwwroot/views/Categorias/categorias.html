<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias</title>

    <!-- FontAwesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/wwwroot/css/categorias.css">
</head>

<body>
    <div id="navbar-placeholder"></div>


    <div class="admin-main">

        <!-- Contenido de tu página -->
        <main class="container-fluid px-4 py-4">

            <!-- Button trigger modal -->
            <div class="page-head">
                <div>
                    <h1>Categoria</h1>
                    <h4 class="subTitle">Manage your product inventory</h4>
                </div>
                <button class="btn-agregar" type="button" onclick="abrirModalCrear()">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i>
                    Agregar
                </button>
            </div>

            <hr class="hr-abajoTitulo">

            <div class="table-custom-container my-4">
                <div class="table-responsive">
                    <table class="table table-custom">
                        <thead>
                            <tr>
                                <th scope="col">Descripcion</th>
                                <th scope="col" class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-categorias">
                        </tbody>
                    </table>
                </div>
            </div>


            <!-- Modal -->
            <div class="modal fade" id="modalRegistroCategoria" data-bs-backdrop="static" data-bs-keyboard="false"
                tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="modalTitulo">Agregar Categoria</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="categoriaID" value="0">

                            <!-- Remueve el id del div y déjalo solo en el input -->
                            <div class="mb-3">
                                <label for="nombreProducto" class="form-label">Nombre Producto</label>
                                <input type="text" id="nombreProducto" class="form-control">
                            </div>

                            <div class="mb-3" id="contenedorEstado" style="display: none;">
                                <label for="eliminado" class="form-label">Estado</label>
                                <select id="eliminado" class="form-select">
                                    <option value="false">Activo</option>
                                    <option value="true">Eliminado</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                            <button type="button" class="btn btn-primary" onclick="guardarRegistro();">Guardar</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="/wwwroot/js/categorias.js"></script>

    <script>
        // sidebar.html trae embebido <script src="/wwwroot/js/sidebar.js">, pero al insertarlo
        // con innerHTML el navegador NO lo ejecuta (restricción de seguridad del DOM).
        // Por eso hace falta agregarlo a mano con createElement, como abajo.
        fetch('/wwwroot/views/Components/sidebar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;

                var script = document.createElement('script');
                script.src = '/wwwroot/js/sidebar.js';
                document.body.appendChild(script);
            })
            .catch(error => console.error('Error cargando sidebar:', error));
    </script>
</body>

</html>
