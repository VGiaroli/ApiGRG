<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | GRG</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/productos.css">
</head>

<body>
    <div id="navbar-placeholder"></div>

    <div class="admin-main">
        <main class="container-fluid px-4 py-4">
            <div class="page-head">
                <div>
                    <p class="eyebrow">Panel de administración</p>
                    <h1>Productos</h1>
                    <h4 class="subTitle">Consulta y filtra el inventario de equipos</h4>
                </div>
                <button type="button" class="btn-imprimir-informe" onclick="imprimir()" title="Generar PDF">
                    <i class="bi bi-file-earmark-pdf-fill" aria-hidden="true"></i>
                    <span>Exportar informe</span>
                </button>
            </div>

            <hr class="hr-abajoTitulo">

            <section class="product-toolbar" aria-label="Filtros de productos">
                <div class="product-search">
                    <label for="buscador-productos">Buscar producto</label>
                    <div class="search-control">
                        <i class="bi bi-search" aria-hidden="true"></i>
                        <input type="search" id="buscador-productos"
                            placeholder="Nombre, categoría o color" autocomplete="off">
                    </div>
                </div>

                <div class="product-filter">
                    <label for="filtro-categoria">Categoría</label>
                    <select id="filtro-categoria" class="form-select">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>

                <div class="product-filter">
                    <label for="filtro-estado">Estado</label>
                    <select id="filtro-estado" class="form-select">
                        <option value="">Todos los estados</option>
                        <option value="1">Sellado</option>
                        <option value="2">Seminuevo</option>
                    </select>
                </div>

                <div class="product-filter">
                    <label for="filtro-disponibilidad">Disponibilidad</label>
                    <select id="filtro-disponibilidad" class="form-select">
                        <option value="">Todas</option>
                        <option value="true">Disponible</option>
                        <option value="false">No disponible</option>
                    </select>
                </div>
            </section>

            <div class="product-list-meta">
                <span id="contador-productos" aria-live="polite">Cargando productos...</span>
                <button type="button" class="btn-clear-filters" id="limpiar-filtros">Limpiar filtros</button>
            </div>

            <div class="table-custom-container my-4">
                <div class="table-responsive">
                    <table class="table table-custom" id="tablaInformeProductos">
                        <thead>
                            <tr>
                                <th scope="col">Nombre</th>
                                <th scope="col">Categoría</th>
                                <th scope="col">Precio ARS</th>
                                <th scope="col">Precio USD</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Disponibilidad</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-productos"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/cdnPDF/jspdf.umd.min.js"></script>
    <script src="/js/cdnPDF/jspdf.plugin.autotable.min.js"></script>
    <script src="/js/listadoPDF/listadoProductos.js"></script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55DT0xhy9Gkc1E1N7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="/js/config.js"></script>
    <script src="/js/productos.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/sesion-usuario.js"></script>
</body>

</html>
